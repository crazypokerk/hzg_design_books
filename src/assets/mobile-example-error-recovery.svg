<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">PDA 异常恢复设计示例</title>
  <desc id="desc">展示 PDA 页面在扫码失败时如何保留码值、说明错误原因，并提供重新扫码和上报异常动作。</desc>
  <style>
    text { font-family: Inter, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    .bg { fill: #ffffff; }
    .device { fill: #111827; stroke: #020617; stroke-width: 1.5; }
    .rail { fill: #0f172a; opacity: .9; }
    .bezel { fill: #1f2937; }
    .screen { fill: #f8fafc; stroke: #334155; stroke-width: 1.2; }
    .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.4; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.2; }
    .green { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.2; }
    .orange { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.2; }
    .red { fill: #fef2f2; stroke: #fecaca; stroke-width: 1.2; }
    .title { fill: #111827; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 13px; }
    .label { fill: #111827; font-size: 14px; font-weight: 700; }
    .body { fill: #111827; font-size: 13px; }
    .small { fill: #6b7280; font-size: 12px; }
    .buttonText { fill: #ffffff; font-size: 15px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="600"/>
  <text x="48" y="56" class="title">异常状态：失败后也能继续作业</text>
  <text x="48" y="82" class="subtitle">错误提示必须说明原因、保留现场数据，并给出可以立即执行的恢复动作。</text>

  <g id="device">
    <rect x="72" y="118" width="272" height="440" rx="34" class="device"/>
    <rect x="82" y="150" width="12" height="334" rx="6" class="rail"/>
    <rect x="322" y="150" width="12" height="334" rx="6" class="rail"/>
    <rect x="64" y="264" width="10" height="88" rx="5" fill="#f59e0b"/>
    <rect x="342" y="246" width="8" height="66" rx="4" fill="#2563eb"/>
    <rect x="118" y="138" width="180" height="30" rx="15" class="bezel"/>
    <rect x="181" y="150" width="54" height="6" rx="3" fill="#475569"/>

    <rect x="100" y="184" width="216" height="328" rx="14" class="screen"/>
    <rect x="100" y="184" width="216" height="42" rx="14" fill="#eef2f7"/>
    <text x="118" y="209" class="label">收货单 SH-1024</text>
    <text x="296" y="209" text-anchor="end" class="small">异常</text>

    <rect x="118" y="240" width="180" height="54" rx="8" class="panel"/>
    <text x="132" y="263" class="label">当前码值</text>
    <text x="132" y="282" class="body">M-99999</text>

    <rect x="118" y="310" width="180" height="86" rx="8" class="red"/>
    <text x="132" y="336" class="label">物料不属于当前收货单</text>
    <text x="132" y="359" class="small">请重新扫描物料码</text>
    <text x="132" y="378" class="small">或上报异常并记录原因</text>

    <rect x="118" y="412" width="86" height="42" rx="8" fill="#2563eb"/>
    <text x="161" y="433" text-anchor="middle" dominant-baseline="middle" class="buttonText">重扫</text>
    <rect x="214" y="412" width="84" height="42" rx="8" fill="#f97316"/>
    <text x="256" y="433" text-anchor="middle" dominant-baseline="middle" class="buttonText">上报</text>

    <rect x="118" y="468" width="180" height="28" rx="8" class="orange"/>
    <text x="132" y="487" class="small">保留码值，焦点回到扫码入口</text>
    <circle cx="136" cy="536" r="7" fill="#334155"/>
    <rect x="176" y="529" width="64" height="14" rx="7" fill="#334155"/>
    <circle cx="280" cy="536" r="7" fill="#334155"/>
  </g>

  <rect x="430" y="128" width="210" height="74" rx="10" class="red"/>
  <text x="454" y="157" class="label">错误原因在页面内可见</text>
  <text x="454" y="180" class="small">不能只依赖一闪而过的 Toast</text>
  <path d="M430 166 L300 350" stroke="#dc2626" stroke-width="1.6" fill="none" marker-end="url(#arrow-red)"/>

  <rect x="680" y="128" width="204" height="74" rx="10" class="panel"/>
  <text x="704" y="157" class="label">保留现场数据</text>
  <text x="704" y="180" class="small">码值、数量、附件不应被清空</text>

  <rect x="430" y="268" width="210" height="74" rx="10" class="blue"/>
  <text x="454" y="297" class="label">恢复动作明确</text>
  <text x="454" y="320" class="small">重扫、上报异常、查看原因</text>
  <path d="M430 305 L300 433" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="680" y="268" width="204" height="74" rx="10" class="orange"/>
  <text x="704" y="297" class="label">焦点回到安全位置</text>
  <text x="704" y="320" class="small">处理后回到扫码入口</text>

  <rect x="430" y="410" width="454" height="86" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="454" y="441" class="label">验收要点</text>
  <text x="454" y="469" class="body">扫码失败后，用户能看见失败原因、刚才扫到的码值，以及至少一个可执行恢复动作。</text>
</svg>
