<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">PDA 连续收货页设计示例</title>
  <desc id="desc">展示 PDA 连续收货页如何组织扫码入口、当前记录、数量输入和固定主按钮。</desc>
  <style>
    text { font-family: Inter, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    .bg { fill: #ffffff; }
    .device { fill: #111827; stroke: #020617; stroke-width: 1.5; }
    .rail { fill: #0f172a; opacity: .9; }
    .bezel { fill: #1f2937; }
    .screen { fill: #f8fafc; stroke: #334155; stroke-width: 1.2; }
    .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.4; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.2; }
    .green { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.2; }
    .orange { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.2; }
    .title { fill: #111827; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 13px; }
    .label { fill: #111827; font-size: 14px; font-weight: 700; }
    .body { fill: #111827; font-size: 13px; }
    .small { fill: #6b7280; font-size: 12px; }
    .tiny { fill: #6b7280; font-size: 11px; }
    .buttonText { fill: #ffffff; font-size: 15px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="600"/>
  <text x="48" y="56" class="title">连续收货页：所有内容服务当前记录</text>
  <text x="48" y="82" class="subtitle">扫码入口、当前物料、数量和确认动作在同一视图内闭环，减少跳转和弹层。</text>

  <g id="device">
    <rect x="74" y="118" width="272" height="440" rx="34" class="device"/>
    <rect x="84" y="150" width="12" height="334" rx="6" class="rail"/>
    <rect x="324" y="150" width="12" height="334" rx="6" class="rail"/>
    <rect x="66" y="264" width="10" height="88" rx="5" fill="#f59e0b"/>
    <rect x="344" y="246" width="8" height="66" rx="4" fill="#2563eb"/>
    <rect x="120" y="138" width="180" height="30" rx="15" class="bezel"/>
    <rect x="183" y="150" width="54" height="6" rx="3" fill="#475569"/>

    <rect x="102" y="184" width="216" height="328" rx="14" class="screen"/>
    <rect x="102" y="184" width="216" height="42" rx="14" fill="#eef2f7"/>
    <text x="120" y="209" class="label">收货单 SH-1024</text>
    <text x="298" y="209" text-anchor="end" class="small">18/24</text>

    <rect x="120" y="240" width="180" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="134" y="263" class="label">扫描物料码</text>
    <text x="134" y="282" class="small">焦点保持在扫码入口</text>
    <circle cx="284" cy="267" r="5" fill="#2563eb"/>

    <rect x="120" y="308" width="180" height="70" rx="8" class="green"/>
    <text x="134" y="333" class="label">M-10086 托盘连接件</text>
    <text x="134" y="354" class="body">规格 L · 库位 A-03-02</text>
    <text x="134" y="370" class="small">应收 24 · 已收 18</text>

    <rect x="120" y="392" width="84" height="46" rx="8" class="panel"/>
    <text x="134" y="414" class="small">本次数量</text>
    <text x="134" y="432" class="label">6 箱</text>
    <rect x="214" y="392" width="86" height="46" rx="8" class="blue"/>
    <text x="228" y="414" class="small">差异</text>
    <text x="228" y="432" class="label">待收 0</text>

    <rect x="120" y="452" width="180" height="48" rx="8" fill="#2563eb"/>
    <text x="210" y="476" text-anchor="middle" dominant-baseline="middle" class="buttonText">确认收货</text>
    <circle cx="138" cy="536" r="7" fill="#334155"/>
    <rect x="178" y="529" width="64" height="14" rx="7" fill="#334155"/>
    <circle cx="282" cy="536" r="7" fill="#334155"/>
  </g>

  <rect x="430" y="126" width="190" height="72" rx="10" class="blue"/>
  <text x="454" y="155" class="label">焦点入口明确</text>
  <text x="454" y="178" class="small">进入页面即可扫码，不需要先点输入框</text>
  <path d="M430 162 L300 267" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="660" y="126" width="214" height="72" rx="10" class="green"/>
  <text x="684" y="155" class="label">当前记录优先</text>
  <text x="684" y="178" class="small">物料、规格、数量集中展示</text>

  <rect x="430" y="262" width="190" height="72" rx="10" class="orange"/>
  <text x="454" y="291" class="label">主操作固定</text>
  <text x="454" y="314" class="small">高频确认按钮始终可触达</text>
  <path d="M430 298 L300 476" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="660" y="262" width="214" height="72" rx="10" class="panel"/>
  <text x="684" y="291" class="label">低频信息后置</text>
  <text x="684" y="314" class="small">完整历史、附件、日志不占首屏</text>

  <rect x="430" y="404" width="444" height="88" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="454" y="436" class="label">验收要点</text>
  <text x="454" y="464" class="body">连续处理一条记录时不跳转；主按钮高度不小于 48px；成功后自动回到扫码入口。</text>
</svg>
