<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">PDA 弱网和真机验收</title>
  <desc id="desc">展示 PDA 页面在首屏轻加载、断网暂存、待补传、恢复上传、提交超时和真机验收中的数据流。</desc>
  <style>
    text { font-family: Inter, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    .bg { fill: #ffffff; }
    .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.2; }
    .green { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.2; }
    .orange { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.2; }
    .red { fill: #fef2f2; stroke: #fecaca; stroke-width: 1.2; }
    .title { fill: #111827; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 13px; }
    .label { fill: #111827; font-size: 14px; font-weight: 700; }
    .body { fill: #111827; font-size: 13px; }
    .small { fill: #6b7280; font-size: 12px; }
    .tiny { fill: #6b7280; font-size: 11px; }
    .buttonText { fill: #ffffff; font-size: 15px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="600"/>
  <text x="48" y="56" class="title">真实设备能跑，才算能上线</text>
  <text x="48" y="82" class="subtitle">首屏轻加载，断网不丢数据，恢复后能补传，最后用目标 PDA 验收。</text>

  <rect x="54" y="126" width="292" height="410" rx="28" fill="#111827"/>
  <rect x="78" y="160" width="244" height="338" rx="12" fill="#ffffff"/>
  <rect x="78" y="160" width="244" height="40" rx="12" fill="#f3f4f6"/>
  <text x="100" y="185" class="label">离线收货</text>
  <text x="300" y="185" text-anchor="end" class="small">弱网</text>
  <rect x="96" y="216" width="208" height="58" rx="8" class="blue"/>
  <text x="112" y="240" class="label">首屏轻加载</text>
  <text x="112" y="259" class="small">任务、库位、扫码入口先可用</text>
  <rect x="96" y="288" width="208" height="62" rx="8" class="orange"/>
  <text x="112" y="313" class="label">断网暂存</text>
  <text x="112" y="334" class="body">本地待补传：3 条</text>
  <rect x="96" y="364" width="208" height="44" rx="8" class="red"/>
  <text x="112" y="391" class="body">提交超时：结果待确认</text>
  <rect x="96" y="442" width="208" height="48" rx="8" fill="#2563eb"/>
  <text x="200" y="466" text-anchor="middle" dominant-baseline="middle" class="buttonText">继续扫码</text>

  <rect x="408" y="124" width="154" height="70" rx="8" class="blue"/>
  <text x="432" y="153" class="label">轻首屏</text>
  <text x="432" y="176" class="small">不等大列表和附件</text>
  <path d="M346 244 H406 V159" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="636" y="124" width="188" height="70" rx="8" class="orange"/>
  <text x="660" y="153" class="label">本地队列</text>
  <text x="660" y="176" class="small">记录 ID、条码、数量、时间</text>
  <path d="M562 159 H634" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="636" y="248" width="188" height="76" rx="8" class="green"/>
  <text x="660" y="278" class="label">恢复上传</text>
  <text x="660" y="302" class="small">显示待补传和失败原因</text>
  <path d="M730 194 V246" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#arrow-green)"/>

  <rect x="408" y="248" width="154" height="76" rx="8" class="red"/>
  <text x="432" y="278" class="label">超时保护</text>
  <text x="432" y="302" class="small">不盲目重复提交</text>
  <path d="M636 286 H564" stroke="#dc2626" stroke-width="1.6" fill="none" marker-end="url(#arrow-red)"/>

  <rect x="408" y="382" width="188" height="98" rx="8" class="panel"/>
  <text x="432" y="412" class="label">旧 WebView 控制成本</text>
  <text x="432" y="438" class="small">少动画、少 DOM、少新特性</text>
  <text x="432" y="462" class="small">附件先缩略，失败保留文件</text>

  <rect x="646" y="374" width="216" height="148" rx="8" class="panel"/>
  <text x="670" y="412" class="label">真机验收动作</text>
  <text x="670" y="440" class="body">连续扫码 50 次</text>
  <text x="670" y="464" class="body">断网录入 10 条</text>
  <text x="670" y="488" class="body">恢复网络后补传</text>
  <text x="670" y="512" class="body">重复扫码不重复提交</text>
  <path d="M730 324 V372" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M596 431 H644" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>

  <g transform="translate(408,552)">
    <line x1="0" y1="8" x2="30" y2="8" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
    <text x="40" y="12" class="tiny">加载 / 验收</text>
    <line x1="134" y1="8" x2="164" y2="8" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
    <text x="174" y="12" class="tiny">补传</text>
    <line x1="236" y1="8" x2="266" y2="8" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>
    <text x="276" y="12" class="tiny">风险处理</text>
  </g>
</svg>
