<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">PDA 小屏视觉层级设计示例</title>
  <desc id="desc">展示 PDA 小屏页面如何通过字号、字重、颜色和空间区分任务、数量、状态和辅助信息。</desc>
  <style>
    text { font-family: Inter, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    .bg { fill: #ffffff; }
    .device { fill: #111827; stroke: #020617; stroke-width: 1.5; }
    .rail { fill: #0f172a; opacity: .9; }
    .bezel { fill: #1f2937; }
    .screen { fill: #f8fafc; stroke: #334155; stroke-width: 1.2; }
    .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.4; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.2; }
    .green { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.2; }
    .orange { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.2; }
    .title { fill: #111827; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 13px; }
    .label { fill: #111827; font-size: 14px; font-weight: 700; }
    .body { fill: #111827; font-size: 13px; }
    .small { fill: #6b7280; font-size: 12px; }
    .tiny { fill: #6b7280; font-size: 11px; }
    .buttonText { fill: #ffffff; font-size: 15px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="600"/>
  <text x="48" y="56" class="title">视觉层级：让关键判断先被看见</text>
  <text x="48" y="82" class="subtitle">小屏上不要平均用力。任务、状态、数量和错误原因必须明显高于备注、历史和日志。</text>

  <g id="device">
    <rect x="72" y="118" width="272" height="440" rx="34" class="device"/>
    <rect x="82" y="150" width="12" height="334" rx="6" class="rail"/>
    <rect x="322" y="150" width="12" height="334" rx="6" class="rail"/>
    <rect x="64" y="264" width="10" height="88" rx="5" fill="#f59e0b"/>
    <rect x="342" y="246" width="8" height="66" rx="4" fill="#2563eb"/>
    <rect x="118" y="138" width="180" height="30" rx="15" class="bezel"/>
    <rect x="181" y="150" width="54" height="6" rx="3" fill="#475569"/>

    <rect x="100" y="184" width="216" height="328" rx="14" class="screen"/>
    <rect x="100" y="184" width="216" height="42" rx="14" fill="#eef2f7"/>
    <text x="118" y="209" class="label">盘点 PD-0901</text>
    <text x="296" y="209" text-anchor="end" class="small">A-03</text>

    <rect x="118" y="242" width="180" height="78" rx="10" class="blue"/>
    <text x="132" y="270" class="label">当前物料</text>
    <text x="132" y="298" fill="#111827" font-size="18" font-weight="700">M-10086</text>

    <rect x="118" y="334" width="84" height="60" rx="10" class="green"/>
    <text x="132" y="358" class="small">实盘</text>
    <text x="132" y="383" fill="#111827" font-size="22" font-weight="700">24</text>
    <rect x="214" y="334" width="84" height="60" rx="10" class="orange"/>
    <text x="228" y="358" class="small">差异</text>
    <text x="228" y="383" fill="#111827" font-size="22" font-weight="700">0</text>

    <rect x="118" y="408" width="180" height="38" rx="8" class="panel"/>
    <text x="132" y="432" class="small">备注：包装完好，可继续处理</text>

    <rect x="118" y="464" width="180" height="36" rx="8" fill="#2563eb"/>
    <text x="208" y="482" text-anchor="middle" dominant-baseline="middle" class="buttonText">确认盘点</text>
    <circle cx="136" cy="536" r="7" fill="#334155"/>
    <rect x="176" y="529" width="64" height="14" rx="7" fill="#334155"/>
    <circle cx="280" cy="536" r="7" fill="#334155"/>
  </g>

  <rect x="430" y="126" width="206" height="74" rx="10" class="blue"/>
  <text x="454" y="155" class="label">第一层：当前判断</text>
  <text x="454" y="178" class="small">任务、物料、状态要优先可读</text>
  <path d="M430 164 L300 282" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="676" y="126" width="206" height="74" rx="10" class="green"/>
  <text x="700" y="155" class="label">第二层：关键数值</text>
  <text x="700" y="178" class="small">数量使用更大字号和字重</text>

  <rect x="430" y="270" width="206" height="74" rx="10" class="orange"/>
  <text x="454" y="299" class="label">第三层：辅助说明</text>
  <text x="454" y="322" class="small">备注、历史、日志弱化或后置</text>
  <path d="M430 308 L300 428" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="676" y="270" width="206" height="74" rx="10" class="panel"/>
  <text x="700" y="299" class="label">状态不只靠颜色</text>
  <text x="700" y="322" class="small">文字、图标、区域共同表达</text>

  <rect x="430" y="414" width="452" height="82" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="454" y="444" class="label">验收要点</text>
  <text x="454" y="472" class="body">在 280px 宽度下，当前任务、物料编码、关键数量和主按钮仍能一眼识别。</text>
</svg>
